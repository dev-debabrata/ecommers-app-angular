<nav class="navbar">
  <div class="logo">
    <a routerLink="/">SnapCart</a>
  </div>

  <ul class="nav-links">
    @for (link of links; track link; let i = $index) {
      <li (mouseenter)="openDropdown(i)" (mouseleave)="closeDropdown()">
        <a [routerLink]="link.name === 'Home' ? '/' : '#'">{{ link.name }}</a>

        <!-- Dropdown only for links with dropdown = true -->
        @if (link.dropdown && openDropdownIndex === i) {
          <ul class="dropdown">
            <li><a href="#">Subcategory 1</a></li>
            <li><a href="#">Subcategory 2</a></li>
          </ul>
        }
      </li>
    }
  </ul>

  <div class="search-bar">
    <input type="text" placeholder="Search products..." />
    <!-- <button>🔍</button> -->
  </div>

  <div class="user-cart">
    <div class="login-section">
      @if (!isLoggedIn) {
        <a
          [routerLink]="isLoggedIn ? '/' : '/login'"
          routerLinkActive="active"
          class="btn secondary"
          >Login</a
        >
      } @else {
        <div class="avatar-container">
          <img (click)="toggleMenu()" src="/avatar.png" alt="" class="avatar-img" />

          @if (showMenu) {
            <div class="dropdown">
              <button (click)="logout()">Logout</button>
            </div>
          }
        </div>
      }
    </div>
    <a routerLink="/wishlist">❤️</a>
    <a routerLink="/cart">🛒 (0)</a>
  </div>
</nav>
