<header class="top-header">
  <div class="header-top">
    <div class="logo">
      <a routerLink="/"><span>SnapCart</span></a>
      <small>BIG MEGA STORE</small>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search for products..." />
      <button>
        <mat-icon class="material-icons-outlined">search</mat-icon>
      </button>
    </div>

    <div class="header-icons">
      <div class="login-section">
        @if (!isLoggedIn) {
          <a
            [routerLink]="isLoggedIn ? '/' : '/login'"
            routerLinkActive="active"
            class="btn secondary"
            >Login</a
          >
        } @else {
          <div class="avatar-container">
            <img (click)="toggleMenu()" src="/avatar.png" alt="" class="avatar-img" />

            @if (showMenu) {
              <div class="dropdown">
                <button (click)="logout()">Logout</button>
              </div>
            }
          </div>
        }
      </div>

      <div class="icon">
        <a href="" class="fav-icon">
          <mat-icon class="material-icons-outlined">favorite_border</mat-icon>
        </a>

        <a href="" class="cart-icon">
          <mat-icon class="material-icons-outlined">shopping_cart</mat-icon>
        </a>
      </div>
    </div>
  </div>

  <app-navbar />
</header>
