<div class="orders">
  <h2>All Orders</h2>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>User ID</th>
          <th>Total</th>

          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        @for (order of orders(); track order.id) {
          <tr>
            <td>{{ order.id }}</td>
            <td>{{ order.userEmail }}</td>
            <td>₹{{ order.total }}</td>

            <td>{{ order.createdAt | date: 'medium' }}</td>

            <!-- <td>
              <select (change)="changeStatus(order, $event)">
                <option value="pending" [selected]="order.status === 'pending'">Pending</option>
                <option value="confirmed" [selected]="order.status === 'confirmed'">
                  Confirmed
                </option>
                <option value="shipped" [selected]="order.status === 'shipped'">Shipped</option>
                <option value="delivered" [selected]="order.status === 'delivered'">
                  Delivered
                </option>
              </select>
            </td> -->

            <td class="status-section">
              <!-- <br /> -->
              <select (change)="changeStatus(order, $event)">
                <option value="pending" [selected]="order.status === 'pending'">Pending</option>
                <option value="confirmed" [selected]="order.status === 'confirmed'">
                  Confirmed
                </option>
                <option value="shipped" [selected]="order.status === 'shipped'">Shipped</option>
                <option value="delivered" [selected]="order.status === 'delivered'">
                  Delivered
                </option>
              </select>

              <span class="status {{ order.status | lowercase }}">
                {{ order.status }}
              </span>
            </td>
            <!-- <td class="status {{ order.status | lowercase }}">
              {{ order.status }}
            </td> -->
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
